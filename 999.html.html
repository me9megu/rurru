<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 담당제 다이어리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f7f5;
    --panel:#ffffff;
    --line:#111111;
    --text:#111111;
    --muted:#8a8a86;
    --gpt-color:#2F6FED;
    --grok-color:#D64933;
    --gemini-color:#1E9E6C;
    --claude-color:#C1633A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 16px 90px;
  }
  .masthead{
    width:100%;
    max-width:560px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:3px solid var(--line);
    padding-bottom:10px;
    margin-bottom:22px;
  }
  .masthead-title{
    font-weight:900;
    font-size:1.5rem;
    letter-spacing:-0.5px;
  }
  .masthead-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    color:var(--muted);
    text-align:right;
    line-height:1.5;
  }
  .legend{
    width:100%;
    max-width:560px;
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:22px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
  }
  .legend-item{ display:flex; align-items:center; gap:6px; }
  .legend-dot{ width:8px;height:8px; }

  /* Calendar */
  .cal-panel{
    width:100%;
    max-width:560px;
    background:var(--panel);
    border:1.5px solid var(--line);
    margin-bottom:26px;
  }
  .cal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 16px;
    border-bottom:1.5px solid var(--line);
  }
  .cal-head-title{
    font-weight:700;
    font-size:1rem;
    font-family:'IBM Plex Mono', monospace;
  }
  .cal-nav{
    display:flex;
    gap:4px;
  }
  .cal-nav button{
    width:26px;height:26px;
    border:1px solid var(--line);
    background:var(--panel);
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
  }
  .cal-nav button:hover{ background:var(--line); color:#fff; }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
  }
  .cal-dow{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.65rem;
    color:var(--muted);
    padding:8px 0;
    border-bottom:1px solid #e2e2de;
  }
  .cal-cell{
    aspect-ratio:1;
    border-right:1px solid #ececea;
    border-bottom:1px solid #ececea;
    padding:5px 6px;
    cursor:pointer;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .cal-cell:nth-child(7n){ border-right:none; }
  .cal-cell.empty{ cursor:default; background:#fbfbfa; }
  .cal-cell.today{ background:#fff9e8; }
  .cal-cell.selected{ background:var(--line); }
  .cal-cell.selected .cal-num{ color:#fff; }
  .cal-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    font-weight:600;
  }
  .cal-badges{
    display:flex;
    gap:2px;
    align-items:center;
    flex-wrap:wrap;
  }
  .cal-remain{
    background:var(--grok-color);
    color:#fff;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.6rem;
    font-weight:700;
    border-radius:50%;
    width:15px;height:15px;
    display:flex;align-items:center;justify-content:center;
  }
  .cal-done-dot{
    width:6px;height:6px;
    border-radius:50%;
    background:var(--gemini-color);
  }

  /* Editor panel */
  .panel{
    width:100%;
    max-width:560px;
    background:var(--panel);
    border:1.5px solid var(--line);
  }
  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    border-bottom:1.5px solid var(--line);
  }
  .panel-head-date{
    font-weight:700;
    font-size:1.05rem;
  }
  .panel-head-day{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--muted);
  }
  .panel-head-day.is-today{ color:var(--grok-color); font-weight:700; }
  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    font-weight:600;
    letter-spacing:1px;
    color:var(--muted);
    padding:14px 18px 8px;
    text-transform:uppercase;
  }
  .role-item{
    border-top:1px solid #e2e2de;
  }
  .role-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 18px;
  }
  .role-row.done .role-input{
    text-decoration:line-through;
    color:var(--muted);
  }
  .role-check{
    -webkit-appearance:none;
    appearance:none;
    width:16px;height:16px;
    border:1.5px solid var(--line);
    flex-shrink:0;
    cursor:pointer;
    position:relative;
  }
  .role-check:checked{ background:var(--line); }
  .role-check:checked::after{
    content:'';
    position:absolute;
    left:4px; top:1px;
    width:4px; height:8px;
    border:solid var(--panel);
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .role-name{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:0.78rem;
    width:78px;
    flex-shrink:0;
    color:var(--role-color, var(--text));
    cursor:pointer;
    user-select:none;
  }
  .role-name .role-label{
    display:block;
    font-size:0.62rem;
    font-weight:400;
    color:var(--muted);
    letter-spacing:0.5px;
  }
  .role-desc{
    display:none;
    padding:0 18px 12px 106px;
    margin-top:-4px;
    font-size:0.78rem;
    line-height:1.5;
    color:var(--muted);
    border-top:1px dashed #e2e2de;
    padding-top:8px;
  }
  .role-desc.open{ display:block; }
  .role-input{
    flex:1;
    border:none;
    background:transparent;
    font-family:'Noto Sans KR', sans-serif;
    font-size:0.88rem;
    outline:none;
    color:var(--text);
    min-width:0;
    border-bottom:1px solid transparent;
  }
  .role-input:focus{ border-bottom:1px solid var(--line); }
  .diary-box{ padding:14px 18px 18px; }
  textarea{
    width:100%;
    min-height:90px;
    border:1px solid #d8d8d3;
    background:var(--panel);
    resize:vertical;
    font-family:'Noto Sans KR', sans-serif;
    font-size:0.9rem;
    line-height:1.6;
    color:var(--text);
    outline:none;
    padding:10px 12px;
    margin-bottom:14px;
  }
  textarea:focus{ border-color:var(--line); }
  .btn-row{ display:flex; gap:8px; }
  .save-btn{
    flex:1;
    background:var(--line);
    color:#fff;
    border:none;
    padding:12px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:0.82rem;
    cursor:pointer;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .save-btn:hover{ opacity:0.85; }
  .save-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .del-btn{
    background:var(--panel);
    color:var(--grok-color);
    border:1px solid var(--grok-color);
    padding:12px 16px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:0.82rem;
    cursor:pointer;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .del-btn:hover{ background:var(--grok-color); color:#fff; }
  .save-msg{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    color:var(--gemini-color);
    text-align:center;
    padding-top:8px;
    height:1em;
  }
  .backup-panel{
    width:100%;
    max-width:560px;
    margin-top:20px;
    border:1px dashed #c9c9c3;
    padding:14px 16px;
  }
  .backup-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    font-weight:600;
    letter-spacing:1px;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .backup-row{ display:flex; gap:8px; margin-bottom:8px; }
  .backup-btn{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--line);
    padding:9px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    font-weight:600;
    cursor:pointer;
    letter-spacing:0.5px;
  }
  .backup-btn:hover{ background:var(--line); color:#fff; }
  .backup-textarea{
    display:none;
    width:100%;
    min-height:90px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    border:1px solid #d8d8d3;
    padding:8px;
    resize:vertical;
    margin-bottom:8px;
  }
  .backup-textarea.open{ display:block; }
  .backup-msg{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    color:var(--muted);
  }
</style>
</head>
<body>
  <div class="masthead">
    <div class="masthead-title">AI 담당제</div>
    <div class="masthead-sub">MONTHLY LOG</div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="cal-panel">
    <div class="cal-head">
      <div class="cal-head-title" id="calTitle">-</div>
      <div class="cal-nav">
        <button id="calPrev">‹</button>
        <button id="calToday">•</button>
        <button id="calNext">›</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div class="panel-head-date" id="panelDate">-</div>
      <div class="panel-head-day" id="panelDay">-</div>
    </div>
    <div class="section-label">Tasks</div>
    <div id="roleList"></div>
    <div class="section-label">Note</div>
    <div class="diary-box">
      <textarea id="entryInput" placeholder="이 날은 어땠어? (혹은 어때야 할까?)"></textarea>
      <div class="btn-row">
        <button class="save-btn" id="saveBtn">저장</button>
        <button class="del-btn" id="delBtn" style="display:none;">삭제</button>
      </div>
      <div class="save-msg" id="saveMsg"></div>
    </div>
  </div>

  <div class="backup-panel">
    <div class="backup-title">Backup / Restore</div>
    <div class="backup-row">
      <button class="backup-btn" id="backupBtn">백업 (복사용 텍스트 생성)</button>
      <button class="backup-btn" id="restoreBtn">복원 (붙여넣기)</button>
    </div>
    <textarea class="backup-textarea" id="backupArea" placeholder="여기에 백업 텍스트를 붙여넣고 '불러오기'를 눌러줘"></textarea>
    <button class="backup-btn" id="restoreConfirmBtn" style="display:none;">불러오기 실행</button>
    <div class="backup-msg" id="backupMsg">저장이 잘 안 될 때, 여기서 데이터를 텍스트로 백업해두고 다음에 붙여넣어 복원할 수 있어.</div>
  </div>

<script>
const ROLES = [
  {key:'grok', label:'여론', name:'싸이코', color:'var(--grok-color)', desc:'실시간으로 도는 화제나 트렌드, 논쟁적인 주제에 대한 날것 반응 확인 담당'},
  {key:'gemini', label:'비서', name:'잼민이', color:'var(--gemini-color)', desc:'두서없는 생각 정리, 요약, 취향 기반 추천 같은 일상 잡무 담당'},
  {key:'claude', label:'제작', name:'똥꼬', color:'var(--claude-color)', desc:'바이브코딩과 아이디어를 실제 결과물로 구체화하는 제작 담당'},
  {key:'gpt', label:'일기', name:'PT', color:'var(--gpt-color)', desc:'3년째 이어온 감정 아카이브, 일기장 역할 담당'},
];
const DOW = ['일','월','화','수','목','금','토'];

let days = [];
let openDesc = {};
let currentTasks = ROLES.map(r => ({ role:r.key, done:false, text:'' }));
let currentText = '';

const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth(); // 0-indexed
let selectedKey = keyOf(now.getFullYear(), now.getMonth()+1, now.getDate());

const legend = document.getElementById('legend');
const calTitle = document.getElementById('calTitle');
const calGrid = document.getElementById('calGrid');
const roleList = document.getElementById('roleList');
const entryInput = document.getElementById('entryInput');
const saveBtn = document.getElementById('saveBtn');
const delBtn = document.getElementById('delBtn');
const saveMsg = document.getElementById('saveMsg');
const panelDate = document.getElementById('panelDate');
const panelDay = document.getElementById('panelDay');

function keyOf(y,m,d){ return `${y}-${m}-${d}`; }
function todayKeyStr(){
  const d = new Date();
  return keyOf(d.getFullYear(), d.getMonth()+1, d.getDate());
}

function renderLegend(){
  legend.innerHTML = '';
  ROLES.forEach(r => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${r.color}"></span><span style="color:${r.color}; font-weight:700;">${r.name}</span><span style="color:var(--muted)">${r.label}</span>`;
    legend.appendChild(item);
  });
}

function remainingCount(dayData){
  if(!dayData) return 0;
  return dayData.tasks.filter(t => t.text && t.text.trim() && !t.done).length;
}
function hasAnyTask(dayData){
  return dayData && dayData.tasks.some(t => t.text && t.text.trim());
}

function renderCalendar(){
  calTitle.textContent = `${viewYear}. ${String(viewMonth+1).padStart(2,'0')}`;
  calGrid.innerHTML = '';
  DOW.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    calGrid.appendChild(el);
  });
  const firstDow = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  for(let i=0;i<firstDow;i++){
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    calGrid.appendChild(el);
  }
  for(let d=1; d<=daysInMonth; d++){
    const key = keyOf(viewYear, viewMonth+1, d);
    const dayData = days.find(x => x.key === key);
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if(key === todayKeyStr()) cell.classList.add('today');
    if(key === selectedKey) cell.classList.add('selected');
    const remain = remainingCount(dayData);
    let badgeHtml = '';
    if(remain > 0){
      badgeHtml = `<div class="cal-badges"><div class="cal-remain">${remain}</div></div>`;
    }else if(hasAnyTask(dayData)){
      badgeHtml = `<div class="cal-badges"><div class="cal-done-dot"></div></div>`;
    }
    cell.innerHTML = `<div class="cal-num">${d}</div>${badgeHtml}`;
    cell.onclick = () => {
      selectedKey = key;
      loadSelected();
      renderCalendar();
    };
    calGrid.appendChild(cell);
  }
}

function formatSelectedHead(){
  const [y,m,d] = selectedKey.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  panelDate.textContent = `${m}월 ${d}일`;
  panelDay.textContent = `${DOW[dt.getDay()]}요일`;
  panelDay.className = 'panel-head-day' + (selectedKey === todayKeyStr() ? ' is-today' : '');
  if(selectedKey === todayKeyStr()) panelDay.textContent += ' · TODAY';
}

function renderRoleList(){
  roleList.innerHTML = '';
  ROLES.forEach(r => {
    const task = currentTasks.find(t => t.role === r.key);
    const item = document.createElement('div');
    item.className = 'role-item';
    item.innerHTML = `
      <div class="role-row${task.done ? ' done' : ''}">
        <input type="checkbox" class="role-check" ${task.done ? 'checked' : ''}>
        <div class="role-name" style="--role-color:${r.color}">${r.name}<span class="role-label">${r.label}</span></div>
        <input type="text" class="role-input" placeholder="이 날 시킬 일" value="${task.text.replace(/"/g,'&quot;')}">
      </div>
      <div class="role-desc${openDesc[r.key] ? ' open' : ''}">${r.desc}</div>
    `;
    item.querySelector('.role-check').onchange = (e) => {
      task.done = e.target.checked;
      renderRoleList();
    };
    item.querySelector('.role-input').oninput = (e) => {
      task.text = e.target.value;
    };
    item.querySelector('.role-name').onclick = () => {
      openDesc[r.key] = !openDesc[r.key];
      renderRoleList();
    };
    roleList.appendChild(item);
  });
}

function loadSelected(){
  const existing = days.find(d => d.key === selectedKey);
  if(existing){
    currentTasks = existing.tasks.map(t => ({...t}));
    currentText = existing.entryText || '';
    delBtn.style.display = 'inline-block';
  }else{
    currentTasks = ROLES.map(r => ({ role:r.key, done:false, text:'' }));
    currentText = '';
    delBtn.style.display = 'none';
  }
  entryInput.value = currentText;
  formatSelectedHead();
  renderRoleList();
  saveMsg.textContent = '';
}

async function loadDays(){
  try{
    const result = await window.storage.get('ai-diary:days', false);
    days = result ? JSON.parse(result.value) : [];
  }catch(e){
    days = [];
  }
  loadSelected();
  renderCalendar();
}

async function saveDays(){
  try{
    await window.storage.set('ai-diary:days', JSON.stringify(days), false);
  }catch(e){
    console.error('저장 실패', e);
  }
}

saveBtn.onclick = async () => {
  saveBtn.disabled = true;
  saveBtn.textContent = '저장 중...';
  const idx = days.findIndex(d => d.key === selectedKey);
  const dayData = { key: selectedKey, tasks: currentTasks, entryText: entryInput.value };
  if(idx >= 0){ days[idx] = dayData; } else { days.push(dayData); }
  await saveDays();
  delBtn.style.display = 'inline-block';
  renderCalendar();
  saveBtn.disabled = false;
  saveBtn.textContent = '저장';
  saveMsg.textContent = '저장됨';
  setTimeout(() => { saveMsg.textContent=''; }, 1500);
};

delBtn.onclick = async () => {
  days = days.filter(d => d.key !== selectedKey);
  await saveDays();
  loadSelected();
  renderCalendar();
};

document.getElementById('calPrev').onclick = () => {
  viewMonth--;
  if(viewMonth < 0){ viewMonth = 11; viewYear--; }
  renderCalendar();
};
document.getElementById('calNext').onclick = () => {
  viewMonth++;
  if(viewMonth > 11){ viewMonth = 0; viewYear++; }
  renderCalendar();
};
document.getElementById('calToday').onclick = () => {
  const d = new Date();
  viewYear = d.getFullYear();
  viewMonth = d.getMonth();
  selectedKey = todayKeyStr();
  loadSelected();
  renderCalendar();
};

const backupBtn = document.getElementById('backupBtn');
const restoreBtn = document.getElementById('restoreBtn');
const restoreConfirmBtn = document.getElementById('restoreConfirmBtn');
const backupArea = document.getElementById('backupArea');
const backupMsg = document.getElementById('backupMsg');

backupBtn.onclick = async () => {
  const text = JSON.stringify(days);
  backupArea.value = text;
  backupArea.classList.add('open');
  restoreConfirmBtn.style.display = 'none';
  try{
    await navigator.clipboard.writeText(text);
    backupMsg.textContent = '아래 텍스트가 클립보드에 복사됐어. 메모장에 붙여넣어줘.';
  }catch(e){
    backupMsg.textContent = '아래 텍스트를 길게 눌러 전체 선택 후 복사해서 메모장에 저장해줘.';
  }
};

restoreBtn.onclick = () => {
  backupArea.value = '';
  backupArea.classList.add('open');
  restoreConfirmBtn.style.display = 'block';
  backupMsg.textContent = '메모장에 저장해둔 백업 텍스트를 여기 붙여넣고 아래 버튼을 눌러줘.';
};

restoreConfirmBtn.onclick = async () => {
  try{
    const parsed = JSON.parse(backupArea.value);
    if(!Array.isArray(parsed)) throw new Error('형식 오류');
    days = parsed;
    await saveDays();
    loadSelected();
    renderCalendar();
    backupMsg.textContent = '복원 완료!';
    backupArea.classList.remove('open');
    restoreConfirmBtn.style.display = 'none';
  }catch(e){
    backupMsg.textContent = '텍스트 형식이 올바르지 않아. 백업할 때 나온 텍스트 그대로 붙여넣어줘.';
  }
};

renderLegend();
loadDays();
</script>
</body>
</html>
